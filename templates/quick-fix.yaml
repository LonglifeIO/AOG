name: quick-fix
version: 1
timeout: 600
description: "Analyze → fix → test → review"

agents:
  - id: gemini
    cli: gemini-cli
    timeout: 120
    flags: ["--yolo", "-m", "gemini-2.5-flash"]
  - id: codex
    cli: codex-cli
    timeout: 180
    flags: ["--full-auto"]
  - id: claude
    cli: claude-code
    timeout: 120
    flags: ["--max-turns", "10"]

stages:
  - id: fix
    type: fan-out
    agents: [codex]
    on_failure: abort

  - id: test
    type: test
    command: "npm test"
    timeout: 120

  - id: review
    type: cross-review
    anonymize: false
