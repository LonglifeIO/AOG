name: full-council
version: 1
timeout: 1800
description: "Fan-out implement → test → cross-review → synthesize → final test"

agents:
  - id: claude
    cli: claude-code
    timeout: 300
    flags: ["--max-turns", "20", "--max-budget-usd", "5.00"]
  - id: codex
    cli: codex-cli
    timeout: 300
    flags: ["--full-auto", "-m", "gpt-5.4"]
  - id: gemini
    cli: gemini-cli
    timeout: 300
    flags: ["--yolo", "-m", "gemini-2.5-pro"]

stages:
  - id: implement
    type: fan-out
    agents: [claude, codex, gemini]
    input: task_description
    on_failure: continue

  - id: test
    type: test
    command: "npm test"
    timeout: 120

  - id: cross-review
    type: cross-review
    anonymize: true

  - id: approve
    type: approval
    mode: interactive

  - id: synthesize
    type: chairman
    chairman: claude
    strategy: chairman-merge

  - id: final-test
    type: test
    command: "npm test && npm run lint"
    timeout: 120
